Object SCUDMissile
  ; gotta tweak the scud so that it doesn't go so far before turning
  ReplaceModule ModuleTag_07
    Behavior = MissileAIUpdate ModuleTag_07_Override
      TryToFollowTarget = No 
      FuelLifetime = 5000
      IgnitionDelay = 0
      InitialVelocity = 50                ; in dist/sec
      DistanceToTravelBeforeTurning = 80
      DistanceToTargetBeforeDiving = 80 ; When I hit this close to target, I ignore PreferredHeight.
    End
  End
  ; replacing the AIModule wipes the Locomotor(s), so we must re-specify here
  Locomotor = SET_NORMAL SCUDMissileLocomotor
End
